{% extends "base.html" %}
{% block content %}
<div class="px-6 pt-5 pb-8">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div class="min-w-0">
      <a href="{{ nav.back }}" class="text-sm text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400">&larr; Back to files</a>
      <h1 class="text-xl font-semibold text-gray-900 dark:text-gray-100 truncate">{{ title }}</h1>
    </div>
    <div class="flex items-center gap-2">
      <a href="{{ nav.html }}" download class="px-3 py-1.5 text-sm font-medium rounded-lg border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700">Download HTML</a>
      <a href="{{ nav.pdf }}" download class="px-3 py-1.5 text-sm font-medium rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white">Export PDF</a>
    </div>
  </div>
  <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-600 overflow-hidden">
    <iframe id="dv-frame" src="{{ nav.frame }}" title="{{ title }}" class="w-full block" style="height:calc(100vh - 11rem);border:0"></iframe>
  </div>
</div>
{% endblock %}
